[package]
name = "designkit"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "designkit"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "stub_gen"
path = "rust/bin/stub_gen.rs"

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pyo3-stub-gen = "0.23.0"
