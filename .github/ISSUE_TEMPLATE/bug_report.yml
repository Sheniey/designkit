name: Bug Report
description: Report a bug in the library.
title: "[Bug]: "
labels: ["bug"]
projects: ["designkit"]
type: bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks so much for taking the time to fill out this bug report...
  
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "No description provided."
    validations:
      required: true
  
  - type: dropdown
    id: version
    attributes:
      label: DesignKit Version
      description: What version of our library are you using?
      options:
        - v0.1.0 -- v0.1.1 (default)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python are you using?
      options:
        - Python 3.14
    validations:
      required: true
  
  - type: dropdown
    id: devices
    attributes:
      label: What OS are you seeing the problem on?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - iOS
      default: ["Windows"]

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any additional information that might be helpful.
      value: "No additional notes."
    validations:
      required: false
